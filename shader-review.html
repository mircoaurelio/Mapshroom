<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projection Atelier Review</title>
    <style>
      :root {
        color: #f4f1e8;
        background: #080908;
        font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 980px;
        background:
          radial-gradient(circle at 50% -20%, rgba(85, 255, 190, 0.1), transparent 34rem),
          #080908;
      }
      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.5rem;
        align-items: end;
        padding: 1.3rem 1.5rem 1rem;
        border-bottom: 1px solid #28302c;
      }
      .eyebrow {
        margin: 0 0 0.38rem;
        color: #70f2ba;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 3.2rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.95;
      }
      .description {
        max-width: 56rem;
        margin: 0.55rem 0 0;
        color: #aeb6b1;
        font-family: Arial, sans-serif;
        font-size: 0.83rem;
        line-height: 1.4;
      }
      .meta {
        color: #a8b3ad;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-align: right;
        text-transform: uppercase;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.72rem;
        padding: 0.85rem 1.5rem 1.5rem;
      }
      figure {
        position: relative;
        overflow: hidden;
        margin: 0;
        border: 1px solid #2a322e;
        border-radius: 0.4rem;
        background: #000;
        box-shadow: 0 0.8rem 2rem rgba(0, 0, 0, 0.24);
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }
      figcaption {
        position: absolute;
        inset: auto 0 0;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 0.62rem;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
        color: #eef3ef;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .error {
        grid-column: 1 / -1;
        padding: 2rem;
        border: 1px solid #a33;
        color: #ff9a9a;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-status="loading">
    <div id="review">Preparing review frames…</div>
    <script type="module" src="/src/shaderReview.ts"></script>
  </body>
</html>
